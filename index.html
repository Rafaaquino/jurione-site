    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "O que é o JuriOne?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "JuriOne é uma plataforma SaaS completa de automação jurídica para escritórios de advocacia. Oferece gestão integrada de processos, clientes, contratos, finanças e recursos avançados de Inteligência Artificial para geração de documentos jurídicos."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona a IA para geração de petições?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nossa IA foi treinada especificamente para o ordenamento jurídico brasileiro. Você fornece os dados do processo e do cliente, e a IA gera uma petição inicial profissional completa com endereçamento, qualificação das partes, fatos, fundamentos jurídicos com citações de legislação, pedidos e valor da causa. O documento fica pronto para revisão e protocolo em minutos."
            }
          },
          {
            "@type": "Question",
            "name": "Quais tipos de petições a IA consegue gerar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A IA suporta múltiplas áreas do direito: Civil, Trabalhista, Consumidor, Família e Penal. Gera petições iniciais, contestações e outros documentos jurídicos com estrutura profissional e citação automática de legislações aplicáveis."
            }
          },
          {
            "@type": "Question",
            "name": "Meus dados estão seguros?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Utilizamos arquitetura multi-tenancy com isolamento completo de dados por escritório. Autenticação via JWT, criptografia de dados, prevenção de SQL injection e XSS, auditoria completa de ações e total compliance com a LGPD."
            }
          },
          {
            "@type": "Question",
            "name": "Posso testar antes de assinar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Oferecemos 7 dias de trial grátis em todos os planos. Você pode testar todas as funcionalidades, incluindo a IA, sem precisar cadastrar cartão de crédito. Se gostar, basta escolher o plano ideal para seu escritório."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona o suporte?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Todos os planos incluem suporte. O plano Básico tem suporte por email, o Profissional inclui suporte prioritário, e o Empresarial oferece suporte dedicado."
            }
          },
          {
            "@type": "Question",
            "name": "Posso migrar meus dados de outro sistema?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Oferecemos suporte para migração de dados de outros sistemas jurídicos. Entre em contato com nossa equipe para um atendimento personalizado e entender como podemos ajudar na transição."
            }
          },
          {
            "@type": "Question",
            "name": "O sistema funciona em dispositivos móveis?",

              "text": "Sim! O JuriOne é totalmente responsivo e funciona perfeitamente em desktop, tablet e smartphone. Acesse seus processos, clientes e documentos de qualquer lugar."
            }
          }
